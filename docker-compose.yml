services:
  api:
    build: ./src/api
    ports:
      - "8000:8000"
    volumes:
      - ./src/data:/app/data:ro
      - mlflow_data:/app/mlflow
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow/mlflow.db
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME:-}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD:-}
      - DATA_DIR=/app/data
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mlflow_data:
